name: Release

on:
  push:
    branches:
      - main
    tags: 
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-tags: true
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        args: --timeout=5m -v
        version: v1.64
    - name: Build
      run: make build
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: true   # gives a chance to review the drafted release.
        prerelease: true # After reviewing online, make it as latest release.
    - name: Upload Release Assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "$GITHUB_REF_NAME" \
          ./packaging/agent-autoupdate.exe --clobber